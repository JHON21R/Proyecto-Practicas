<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso — Curso APS</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  html, body {
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .login-card {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  /* Franja superior con el degradado de la marca */
  .login-top {
    background: linear-gradient(90deg, #2e7d32, #00897b, #1565c0);
    height: 8px;
  }

  .login-body {
    padding: 34px 34px 30px;
  }

  .login-logo {
    display: block;
    margin: 0 auto 18px;
    margin-left: auto;
    margin-right: auto;
    width: 260px;
    max-width: 80%;
    height: auto;
    position: relative;
    left: 72px;
  }

  .login-titulo {
    text-align: center;
    color: #1b5e20;
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 6px;
    line-height: 1.25;
  }

  .login-subtitulo {
    text-align: center;
    color: #555;
    font-size: 0.95rem;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .campo {
    margin-bottom: 18px;
  }

  .campo label {
    display: block;
    font-size: 0.9rem;
    font-weight: 700;
    color: #00695c;
    margin-bottom: 7px;
  }

  .campo select,
  .campo input {
    width: 100%;
    border: 1.5px solid #cfd8dc;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    color: #222;
    background: #f8fafb;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .campo select:focus,
  .campo input:focus {
    outline: none;
    border-color: #00897b;
    box-shadow: 0 0 0 3px rgba(0, 137, 162, 0.15);
    background: #fff;
  }

  .btn-ingresar {
    width: 100%;
    background: #2e7d32;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
    margin-top: 6px;
  }

  .btn-ingresar:hover {
    background: #1b5e20;
  }

  .btn-ingresar:active {
    transform: translateY(1px);
  }

  .btn-ingresar:disabled {
    background: #9e9e9e;
    cursor: not-allowed;
    box-shadow: none;
  }

  .login-msg {
    text-align: center;
    font-size: 0.9rem;
    margin-top: 16px;
    min-height: 20px;
  }

  .login-msg.error { color: #c62828; }
  .login-msg.ok    { color: #2e7d32; }

  .login-nota {
    text-align: center;
    font-size: 0.78rem;
    color: #90a4ae;
    margin-top: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  
  <div class="login-card">
    <div class="login-top"></div>
    <div class="login-body">

      <img class="login-logo" src="img/logo-curso-aps.png" alt="Curso Virtual APS">

      <p class="login-subtitulo">Ingresa con tu número de cédula para registrar tu progreso.</p>

      <form id="form-login" autocomplete="off">
        <div class="campo">
          <input type="text" id="numeroDoc" inputmode="numeric"
                 placeholder="Número de cédula" required>
        </div>

        <button type="submit" class="btn-ingresar" id="btn-ingresar">Comenzar el curso</button>
        <div class="login-msg" id="login-msg"></div>
      </form>
    </div>
  </div>

<script src="js/auth.js"></script>
<script>
  var form      = document.getElementById('form-login');
  var inpNumero = document.getElementById('numeroDoc');
  var btn       = document.getElementById('btn-ingresar');
  var msg       = document.getElementById('login-msg');

  function mostrar(texto, clase) {
    msg.textContent = texto;
    msg.className = 'login-msg ' + (clase || '');
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var tipoDoc   = 'CC';
    var numeroDoc = inpNumero.value.trim();

    if (!numeroDoc) {
      return mostrar('Escribe tu número de cédula.', 'error');
    }
    if (!/^\d{4,}$/.test(numeroDoc)) {
      return mostrar('El número de cédula debe tener solo dígitos (mínimo 4).', 'error');
    }

    btn.disabled = true;
    mostrar('Ingresando…', '');

    registrarParticipante(tipoDoc, numeroDoc)
      .then(function(data) {
        if (data && data.participante) {
          /* Guarda la sesión del estudiante en este navegador */
          guardarSesion(data.participante.docId, tipoDoc, numeroDoc);
          mostrar('¡Listo! Entrando al curso…', 'ok');
          window.location.href = 'index.html';
        } else {
          btn.disabled = false;
          mostrar((data && data.error) || 'No se pudo ingresar. Intenta de nuevo.', 'error');
        }
      })
      .catch(function() {
        btn.disabled = false;
        mostrar('No se pudo conectar con el servidor. Verifica que esté disponible.', 'error');
      });
  });
</script>
</body>
</html>
